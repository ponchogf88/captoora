[project]
name = "captoora-agents"
version = "0.1.0"
description = "Sistema multi-agente de 7 bots con compuerta de aprobacion humana y hub operativo tipo Asana para Captoora Sports (Monterrey / San Pedro)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0,<47.0.0",
    "fastapi>=0.115.0",
    "google-antigravity>=0.1.23",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
