<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Captoora Studio · Antes / Después de Luz (CPT-REEL-01)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0b0c10;
      color: #ffffff;
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0b0c10;
    }
    .bg-stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }
    .studio-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(200, 245, 59, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(200, 245, 59, 0.04) 1px, transparent 1px);
      background-size: 56px 56px;
    }
    .lime-halo {
      position: absolute;
      width: 780px;
      height: 780px;
      left: 110px;
      top: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200, 245, 59, 0.14) 0%, rgba(200, 245, 59, 0) 68%);
    }
    /* Banda segura estricta: y=152..1352px, x=56..944px (rail derecho + 568px abajo libres para subtítulos) */
    .safe-stage {
      position: absolute;
      top: 152px;
      left: 56px;
      width: 888px;
      height: 1200px;
      z-index: 10;
    }
    /* Gancho textual fijo arriba (REF-15): nunca toca ni cubre al sujeto fotografiado */
    .top-hook-clip {
      position: absolute;
      top: 0;
      left: 0;
      width: 888px;
      height: 184px;
    }
    .top-hook-card {
      width: 100%;
      background: #13161f;
      border: 2px solid #2b3142;
      border-radius: 26px;
      padding: 20px 28px;
      text-align: center;
    }
    .hook-kicker {
      font-size: 40px;
      font-weight: 900;
      line-height: 1.08;
      color: #ffffff;
      letter-spacing: -0.015em;
    }
    .hook-accent {
      font-size: 46px;
      font-weight: 900;
      line-height: 1.08;
      color: #c8f53b;
      letter-spacing: -0.015em;
      margin-top: 4px;
    }
    .stage-body {
      position: absolute;
      top: 206px;
      left: 0;
      width: 888px;
      height: 980px;
    }
    .cta-body {
      position: absolute;
      top: 40px;
      left: 0;
      width: 888px;
      height: 1140px;
    }
    /* Contenedor fotográfico Zero-Crop: object-fit contain preserva 100% cabeza, casco y calzado */
    .photo-showcase {
      width: 100%;
      background: #060709;
      border: 3px solid #2a3040;
      border-radius: 28px;
      padding: 16px;
    }
    .photo-frame {
      position: relative;
      width: 100%;
      height: 600px;
      border-radius: 18px;
      overflow: hidden;
      background: #050507;
    }
    .photo-full {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .before-layer {
      position: absolute;
      inset: 0;
      clip-path: inset(0 0 0 10%);
    }
    .before-grade {
      filter: brightness(0.62) contrast(0.74) saturate(0.45);
    }
    .wipe-divider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 6px;
      background: #c8f53b;
    }
    .wipe-legend {
      margin-top: 18px;
      background: #13161f;
      border: 2px solid #2b3142;
      border-radius: 22px;
      padding: 20px 26px;
    }
    .legend-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .pill-muted {
      padding: 6px 16px;
      border-radius: 999px;
      background: #232736;
      color: #e2e8f0;
      font-size: 28px;
      font-weight: 800;
    }
    .pill-lime {
      padding: 6px 18px;
      border-radius: 999px;
      background: #c8f53b;
      color: #0b0c10;
      font-size: 28px;
      font-weight: 900;
    }
    .wipe-rail {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: #232736;
      overflow: hidden;
    }
    .wipe-fill {
      width: 100%;
      height: 100%;
      background: #c8f53b;
      transform-origin: left center;
    }
    .studio-frame {
      position: relative;
      width: 100%;
      height: 540px;
      border-radius: 18px;
      overflow: hidden;
      background: #050507;
    }
    .chips-3 {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .chip-box {
      background: #13161f;
      border: 2px solid #2b3142;
      border-radius: 20px;
      padding: 18px 12px;
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      color: #f8fafc;
    }
    .chip-accent {
      color: #c8f53b;
      display: block;
      margin-bottom: 4px;
      font-size: 28px;
      font-weight: 900;
    }
    /* Cierre: foto protagonista intacta arriba + popup oficial @captoora.studio (REF-15) */
    .cta-photo-card {
      width: 100%;
      background: #060709;
      border: 3px solid #2a3040;
      border-radius: 28px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .cta-photo-frame {
      position: relative;
      width: 100%;
      height: 500px;
      border-radius: 18px;
      overflow: hidden;
      background: #050507;
    }
    .follow-popup {
      width: 100%;
      background: #13161f;
      border: 3px solid #c8f53b;
      border-radius: 30px;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .profile-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .profile-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .logo-badge {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: #0b0c10;
      border: 2px solid #c8f53b;
      padding: 10px;
      object-fit: contain;
    }
    .handle-txt {
      font-size: 36px;
      font-weight: 900;
      color: #ffffff;
    }
    .loc-txt {
      font-size: 28px;
      font-weight: 600;
      color: #cbd5e1;
      margin-top: 2px;
    }
    .btn-seguir {
      padding: 14px 28px;
      border-radius: 999px;
      background: #c8f53b;
      color: #0b0c10;
      font-size: 30px;
      font-weight: 900;
      white-space: nowrap;
    }
    .cta-strip {
      background: #c8f53b;
      color: #0b0c10;
      border-radius: 20px;
      padding: 18px 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 32px;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="cpt01_antes_despues" data-start="0" data-duration="34.24" data-width="1080" data-height="1920" data-fps="30">
    <audio id="master-audio" class="clip" src="assets/cpt01_master.wav" data-start="0" data-duration="34.24" data-volume="1" data-track-index="10"></audio>

    <div class="bg-stage" data-layout-ignore>
      <div id="studio-grid" class="studio-grid"></div>
      <div id="lime-halo" class="lime-halo"></div>
    </div>

    <div class="safe-stage">
      <!-- GANCHO TEXTUAL PERSISTENTE ARRIBA (REF-15) -->
      <div id="top-hook" class="clip top-hook-clip" data-start="0" data-duration="27.96">
        <div id="top-hook-card" class="top-hook-card">
          <div class="hook-kicker">¿TU FOTO SE VE PLANA?</div>
          <div class="hook-accent">LA LUZ LO CAMBIA TODO</div>
        </div>
      </div>

      <!-- ESCENA A: ZOOM 0s + CORTINA CONTINUA ANTES -> DESPUÉS -->
      <div id="sc-a" class="clip stage-body" data-start="0.0" data-duration="18.54">
        <div id="sc-a-inner">
          <div id="sa-showcase" class="photo-showcase">
            <div class="photo-frame">
              <img class="photo-full" src="assets/hero-portrait-after.jpg" alt="Retrato oficial Captoora con luz dirigida" />
              <div id="before-overlay" class="before-layer">
                <img class="photo-full" src="assets/hero-portrait-before.jpg" alt="Simulación luz plana antes" />
              </div>
              <div id="wipe-divider" class="wipe-divider"></div>
            </div>
          </div>
          <div class="wipe-legend">
            <div class="legend-row">
              <span class="pill-muted">ANTES · LUZ PLANA</span>
              <span class="pill-lime">DESPUÉS · LUZ CAPTOORA</span>
            </div>
            <div class="wipe-rail"><div id="wipe-prog" class="wipe-fill"></div></div>
          </div>
        </div>
      </div>

      <!-- ESCENA B: ESTUDIO REAL COLINAS DE SAN JERÓNIMO -->
      <div id="sc-b" class="clip stage-body" data-start="18.54" data-duration="9.54">
        <div id="sc-b-inner">
          <div class="photo-showcase">
            <div class="studio-frame">
              <img id="sb-photo" class="photo-full" src="assets/escenario-1.jpg" alt="Escenario 1 Captoora Studio" />
            </div>
          </div>
          <div class="chips-3">
            <div class="chip-box"><span class="chip-accent">SET PRO</span>Softbox + Luz</div>
            <div class="chip-box"><span class="chip-accent">MONTERREY</span>Colinas</div>
            <div class="chip-box"><span class="chip-accent">GUÍA REAL</span>Pose y cámara</div>
          </div>
        </div>
      </div>

      <!-- ESCENA C: POPUP @captoora.studio + COMENTA SESIÓN -->
      <div id="sc-c" class="clip cta-body" data-start="28.08" data-duration="6.16">
        <div id="sc-c-inner">
          <div class="cta-photo-card">
            <div class="cta-photo-frame">
              <img id="sc-photo" class="photo-full" src="assets/hero-portrait-cta.jpg" alt="Retrato oficial Captoora Studio" />
            </div>
          </div>
          <div id="follow-popup" class="follow-popup">
            <div class="profile-row">
              <div class="profile-left">
                <img class="logo-badge" src="assets/captoora_logo_lente_centrado_blanco.png" alt="Logo Captoora" />
                <div>
                  <div class="handle-txt">@captoora.studio</div>
                  <div class="loc-txt">Colinas, MTY</div>
                </div>
              </div>
              <div class="btn-seguir">Seguir</div>
            </div>
            <div class="cta-strip">
              <span>COMENTA: SESIÓN</span>
              <span>WA 81 4005 0088</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#studio-grid", { backgroundPosition: "0px 0px" }, { backgroundPosition: "56px 56px", duration: 34.24, ease: "none" }, 0);
      tl.fromTo("#lime-halo", { x: -40, y: 0 }, { x: 90, y: 80, duration: 34.24, ease: "sine.inOut" }, 0);

      // Titular fijo sale al entrar el popup de cierre
      tl.fromTo("#top-hook-card", { y: -12, opacity: 1 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0);
      tl.to("#top-hook-card", { y: -24, opacity: 0, duration: 0.22, ease: "power2.in" }, 27.74);

      // Escena A: Punch-in zoom en t=0 (REF-15) + cortina continua Antes -> Después
      tl.fromTo("#sa-showcase", { scale: 0.90 }, { scale: 1.0, duration: 0.50, ease: "power3.out" }, 0);
      tl.fromTo("#before-overlay", { clipPath: "inset(0 0 0 10%)" }, { clipPath: "inset(0 0 0 98%)", duration: 17.34, ease: "power1.inOut" }, 0.65);
      tl.fromTo("#wipe-divider", { x: 85 }, { x: 838, duration: 17.34, ease: "power1.inOut" }, 0.65);
      tl.fromTo("#wipe-prog", { scaleX: 0.10 }, { scaleX: 0.98, duration: 17.34, ease: "power1.inOut" }, 0.65);
      tl.to("#sc-a-inner", { x: -60, opacity: 0, duration: 0.22, ease: "power2.in" }, 18.32);

      // Escena B: Estudio real con zoom continuo suave
      tl.fromTo("#sc-b-inner", { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.28, ease: "power3.out" }, 18.54);
      tl.fromTo("#sb-photo", { scale: 1.0 }, { scale: 1.06, duration: 9.29, ease: "sine.inOut" }, 18.54);
      tl.to("#sc-b-inner", { x: -60, opacity: 0, duration: 0.22, ease: "power2.in" }, 27.86);

      // Escena C: Popup @captoora.studio + pulso suave en retrato
      tl.fromTo("#sc-c-inner", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 28.08);
      tl.fromTo("#follow-popup", { scale: 0.92 }, { scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 28.38);
      tl.fromTo("#sc-photo", { scale: 1.0 }, { scale: 1.04, duration: 5.81, ease: "sine.inOut" }, 28.08);

      window.__timelines = window.__timelines || {};
      window.__timelines["cpt01_antes_despues"] = tl;
    })();
  </script>
</body>
</html>
