<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Black Canvas Coloreado Stickers · Captoora</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #stage {
      width: 1080px;
      height: 1080px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px;
      background: transparent;
    }
    .canvas-card {
      width: 952px;
      background: #0d0e12;
      border: 4px solid #2b3040;
      border-radius: 42px;
      padding: 46px 48px;
      color: #f8fafc;
      box-shadow: 0 24px 0 #07080b;
      position: relative;
      overflow: hidden;
    }
    .canvas-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
    }
    .inner { position: relative; z-index: 2; }
    .tag {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-bottom: 18px;
      text-transform: uppercase;
    }
    .t-cyan { background: rgba(56,189,248,0.16); color: #38bdf8; border: 2px solid #38bdf8; }
    .t-amber { background: rgba(245,158,11,0.16); color: #fbbf24; border: 2px solid #f59e0b; }
    .t-green { background: rgba(52,211,153,0.16); color: #34d399; border: 2px solid #10b981; }
    .t-red { background: rgba(251,113,133,0.16); color: #fb7185; border: 2px solid #f43f5e; }
    .title {
      font-size: 46px;
      font-weight: 900;
      line-height: 1.12;
      margin-bottom: 12px;
      color: #ffffff;
    }
    .sub {
      font-size: 27px;
      line-height: 1.35;
      color: #cbd5e1;
      margin-bottom: 28px;
    }
    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }
    .row3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .box {
      background: #14161f;
      border: 3px solid #2d3344;
      border-radius: 26px;
      padding: 24px 24px;
    }
    .box-cyan { border-color: #38bdf8; }
    .box-amber { border-color: #f59e0b; }
    .box-green { border-color: #34d399; }
    .box-red { border-color: #fb7185; }
    .box-head {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .c-cyan { color: #38bdf8; }
    .c-amber { color: #fbbf24; }
    .c-green { color: #34d399; }
    .c-red { color: #fb7185; }
    .box-body {
      font-size: 25px;
      line-height: 1.35;
      color: #e2e8f0;
      font-weight: 600;
    }
    .foot-note {
      margin-top: 24px;
      padding: 16px 22px;
      border-radius: 18px;
      background: #161923;
      border: 2px solid #2b3142;
      font-size: 24px;
      font-weight: 700;
      color: #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    svg.diag { width: 100%; height: auto; display: block; margin-bottom: 18px; }
  </style>
</head>
